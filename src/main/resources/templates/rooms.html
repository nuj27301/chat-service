<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --border: #1e1e2e;
            --neon: #00f5a0;
            --neon-dim: rgba(0, 245, 160, 0.15);
            --neon-glow: 0 0 20px rgba(0, 245, 160, 0.4);
            --text: #e0e0e0;
            --muted: #555570;
            --danger: #ff4466;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(0, 245, 160, 0.03) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(0, 100, 255, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 1.8rem;
            color: var(--neon);
            text-shadow: var(--neon-glow);
            margin-bottom: 0.3rem;
            letter-spacing: -1px;
        }

        .logo span { color: var(--muted); font-size: 0.9rem; display: block; margin-top: 4px; font-weight: 400; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .card-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: var(--text);
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--neon);
            box-shadow: 0 0 0 3px rgba(0, 245, 160, 0.1);
        }

        .btn {
            background: var(--neon-dim);
            border: 1px solid var(--neon);
            color: var(--neon);
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--neon);
            color: var(--bg);
            box-shadow: var(--neon-glow);
        }

        .btn-danger {
            background: rgba(255, 68, 102, 0.1);
            border-color: var(--danger);
            color: var(--danger);
            padding: 0.3rem 0.7rem;
            font-size: 0.65rem;
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
            box-shadow: 0 0 15px rgba(255, 68, 102, 0.4);
        }

        .room-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }

        .room-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            transition: border-color 0.2s, transform 0.2s;
            animation: fadeUp 0.4s ease both;
        }

        .room-item:hover {
            border-color: var(--neon);
            transform: translateX(4px);
        }

        .room-link {
            color: var(--text);
            text-decoration: none;
            font-size: 0.95rem;
            flex: 1;
        }

        .room-link:hover { color: var(--neon); }

        .badge {
            background: var(--neon);
            color: var(--bg);
            border-radius: 20px;
            padding: 0.1rem 0.5rem;
            font-size: 0.7rem;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            margin-right: 0.7rem;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            padding: 2rem 0;
            font-family: 'Space Mono', monospace;
        }

        .header { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            // CHAT
            <span>실시간 채팅 서비스</span>
        </div>
    </div>

    <div class="card">
        <div class="card-title">닉네임 설정</div>
        <form action="/" method="get">
            <div class="input-row">
                <input type="text" name="username" placeholder="닉네임 입력" th:value="${username}">
                <button type="submit" class="btn">설정</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="card-title">채팅방 만들기</div>
        <form action="/room" method="post">
            <div class="input-row">
                <input type="text" name="name" placeholder="채팅방 이름">
                <button type="submit" class="btn">생성</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="card-title">채팅방 목록</div>
        <ul class="room-list">
            <li th:if="${#lists.isEmpty(rooms)}" class="empty">// 채팅방이 없습니다</li>
            <li class="room-item" th:each="room, iter : ${rooms}"
                th:style="'animation-delay:' + ${iter.index * 0.05} + 's'">
                <a class="room-link"
                   th:href="@{/room/{id}(id=${room.id}, username=${username})}"
                   th:text="${room.name}"></a>
                <span class="badge"
                      th:if="${unreadCounts[room.id] > 0}"
                      th:text="${unreadCounts[room.id]}"></span>
                <form th:action="@{/room/{id}/delete(id=${room.id})}" method="post">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
