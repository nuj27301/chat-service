<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅방 목록</title>
</head>
<body>
    <h1>채팅방 목록</h1>

    <form action="/room" method="post">
        <input type="text" name="name" placeholder="채팅방 이름">
        <button type="submit">채팅방 만들기</button>
    </form>

    <ul>
        <li th:each="room : ${rooms}">
            <a th:href="@{/room/{id}(id=${room.id})}" th:text="${room.name}"></a>
        </li>
    </ul>
</body>
</html>
