<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${room.name}">채팅방</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <h1 th:text="${room.name}">채팅방</h1>
    <a href="/">목록으로</a>

    <div id="messages">
        <div th:each="msg : ${messages}">
            <b th:text="${msg.sender}"></b>: <span th:text="${msg.content}"></span>
        </div>
    </div>

    <input type="text" id="sender" placeholder="닉네임">
    <input type="text" id="content" placeholder="메시지 입력">
    <button onclick="sendMessage()">전송</button>

    <script th:inline="javascript">
        const roomId = [[${room.id}]];
        let stompClient = null;

        const socket = new SockJS('/ws-chat');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function() {
            stompClient.subscribe('/sub/chat/room/' + roomId, function(message) {
                const msg = JSON.parse(message.body);
                const div = document.createElement('div');
                div.innerHTML = '<b>' + msg.sender + '</b>: ' + msg.content;
                document.getElementById('messages').appendChild(div);
            });

            stompClient.send('/pub/chat/message', {}, JSON.stringify({
                type: 'ENTER',
                roomId: roomId,
                sender: document.getElementById('sender').value || '익명'
            }));
        });

        function sendMessage() {
            const sender = document.getElementById('sender').value || '익명';
            const content = document.getElementById('content').value;
            if (!content) return;

            stompClient.send('/pub/chat/message', {}, JSON.stringify({
                type: 'TALK',
                roomId: roomId,
                sender: sender,
                content: content
            }));

            document.getElementById('content').value = '';
        }
    </script>
</body>
</html>
